<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy Tools Hub</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: #e6f7ff;
        background: #020817;
      }
      #root { min-height: 100vh; }
      .app {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
      }
      .bg {
        position: absolute;
        inset: 0;
        opacity: .8;
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 20% 20%, rgba(16,185,255,.25), transparent 45%),
          linear-gradient(180deg, rgba(2,8,23,.3), rgba(2,8,23,.95));
      }
      .content {
        position: relative;
        z-index: 2;
        max-width: 1050px;
        margin: 0 auto;
        padding: 3rem 1rem;
      }
      .hero { text-align: center; margin-bottom: 2rem; }
      .hero h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); }
      .hero p { color: #b3dff4; max-width: 700px; margin: .75rem auto 0; }
      .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      .card {
        border: 1px solid rgba(125,211,252,.3);
        border-radius: 14px;
        padding: 1rem;
        background: rgba(8,47,73,.35);
        backdrop-filter: blur(8px);
      }
      .card h3 { margin: 0 0 .5rem; }
      .card p { margin: 0; color: #caedff; font-size: .95rem; }
      .btn-row { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .85rem; }
      .btn {
        border: 1px solid rgba(125,211,252,.6);
        background: rgba(12,74,110,.55);
        color: #e0f2fe;
        padding: .45rem .7rem;
        border-radius: 8px;
        text-decoration: none;
        font-size: .88rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import React, { forwardRef } from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
      import { Shader } from 'https://esm.sh/react-shaders@2.2.0';

      const cn = (...classes) => classes.filter(Boolean).join(' ');

      const fragmentShader = `
float hash(vec2 p){return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453);} 
float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.0-2.0*f);float a=hash(i);float b=hash(i+vec2(1.0,0.0));float c=hash(i+vec2(0.0,1.0));float d=hash(i+vec2(1.0,1.0));return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);} 
float interferencePattern(vec2 uv,float time){float w1=sin(uv.x*15.0+time*2.0)*cos(uv.y*10.0+time*1.5);float w2=sin(uv.x*8.0-time*1.8)*cos(uv.y*12.0-time*2.2);float w3=sin(uv.x*20.0+uv.y*15.0+time*1.0);return (w1*0.4+w2*0.3+w3*0.3)*0.5+0.5;} 
float scanLines(vec2 uv,float time,float density){float s1=sin((uv.y+time*0.1)*density*40.0);float s2=sin((uv.y-time*0.05)*density*25.0);float b=sin(uv.y*5.0+time*3.0)*step(0.95,noise(vec2(time*2.0,0.0)));return (s1*0.3+s2*0.2+b*0.8)*0.5+0.7;} 
float hologramFlicker(vec2 uv,float time,float st){float pf=noise(vec2(time*5.0,0.0));float mf=step(0.95+st*0.04,noise(vec2(time*3.0,1.0)));float li=noise(uv*3.0+time*2.0);li=step(0.7+st*0.2,li);float bs=0.7+st*0.3;float fs=bs*(1.0-mf*0.8)*(1.0-li*0.3);return mix(0.3,1.0,fs*(0.8+pf*0.2));}
vec3 prismaticSeparation(vec2 uv,float time,float amount){vec2 r=vec2(amount*0.002*sin(time),0.0);vec2 g=vec2(0.0,amount*0.002*cos(time*1.3));vec2 b=vec2(-amount*0.002*sin(time*0.8),amount*0.002*cos(time*1.7));float red=interferencePattern(uv+r,time);float green=interferencePattern(uv+g,time+100.0);float blue=interferencePattern(uv+b,time+200.0);return vec3(red,green,blue);} 
float depthScan(vec2 uv,float time){float s1=sin(time*1.5+uv.y*8.0);float s2=sin(time*2.0-uv.x*6.0);float dp=fract(time*0.2);float pd=abs(uv.y-dp);float ps=exp(-pd*20.0)*2.0;return (s1*s2*0.3+ps)*0.5+0.5;} 
float hologramEdge(vec2 uv){float ex=min(uv.x,1.0-uv.x);float ey=min(uv.y,1.0-uv.y);float ed=min(ex,ey);return exp(-ed*8.0)*0.5;} 
void mainImage(out vec4 fragColor,in vec2 fragCoord){vec2 uv=fragCoord/iResolution.xy;float time=iTime*u_speed;vec3 base=prismaticSeparation(uv,time,u_prismatic);float inter=interferencePattern(uv,time);base*=inter;float scan=scanLines(uv,time,u_scanlines);base*=scan;float depth=depthScan(uv,time);base+=vec3(0.1,0.3,0.5)*depth*0.3;float flick=hologramFlicker(uv,time,u_stability);base*=flick;float edge=hologramEdge(uv);base+=vec3(0.2,0.6,1.0)*edge;base=mix(base,base*vec3(0.3,0.8,1.0),0.6);float n=noise(uv*100.0+time*10.0);base+=(n-0.5)*0.05;base*=0.6+u_stability*0.4;base*=u_intensity;float alpha=0.7+inter*0.2+flick*0.1;base=clamp(base,0.0,1.0);fragColor=vec4(base,alpha);} `;

      const HologramShaders = forwardRef(function HologramShaders({ className, speed = 1, intensity = 1, stability = 1, scanlines = 1, prismatic = 1, ...props }, ref) {
        return React.createElement('div', { className: cn('w-full h-full', className), ref, ...props },
          React.createElement(Shader, {
            fs: fragmentShader,
            style: { width: '100%', height: '100%' },
            uniforms: {
              u_speed: { type: '1f', value: speed },
              u_intensity: { type: '1f', value: intensity },
              u_stability: { type: '1f', value: stability },
              u_scanlines: { type: '1f', value: scanlines },
              u_prismatic: { type: '1f', value: prismatic },
            },
          })
        );
      });

      function App() {
        const sections = [
          { title: 'Game Mirrors', desc: 'Launch browser game mirrors with quick fallback links.' },
          { title: 'Web Proxy', desc: 'Paste a URL and open through a secure browsing gateway.' },
          { title: 'Utility Tools', desc: 'Tab cloaker, history cleaner, and quick privacy toggles.' },
          { title: 'Downloads', desc: 'Get offline bundles, launcher scripts, and backup configs.' },
        ];

        return React.createElement('main', { className: 'app' },
          React.createElement(HologramShaders, { className: 'bg', speed: 1.2, scanlines: 1.25, prismatic: 1.1 }),
          React.createElement('div', { className: 'overlay' }),
          React.createElement('section', { className: 'content' },
            React.createElement('header', { className: 'hero' },
              React.createElement('h1', null, 'Proxy Tools Hub'),
              React.createElement('p', null, 'A futuristic starter homepage for proxy utilities, browser games, and quick-launch web tools.')
            ),
            React.createElement('div', { className: 'grid' },
              ...sections.map((item) => React.createElement('article', { className: 'card', key: item.title },
                React.createElement('h3', null, item.title),
                React.createElement('p', null, item.desc),
                React.createElement('div', { className: 'btn-row' },
                  React.createElement('a', { className: 'btn', href: '#', onClick: (e) => e.preventDefault() }, 'Open'),
                  React.createElement('a', { className: 'btn', href: '#', onClick: (e) => e.preventDefault() }, 'Settings')
                )
              ))
            )
          )
        );
      }

      createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
